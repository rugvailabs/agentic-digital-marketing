# TrendForge local stack.
#
# Windows note: api, worker and beat run in Linux containers because Celery
# has no supported Windows worker pool. The Next.js app runs on the host
# (`pnpm dev`) for fast HMR; the `web` service exists behind a profile for
# the rare case you want the whole stack containerised.
name: trendforge

x-api-env: &api-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://trendforge:trendforge@postgres:5432/trendforge}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
  S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9020}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-trendforge}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-trendforge-secret}
  S3_BUCKET: ${S3_BUCKET:-trendforge-assets}
  ENV: ${ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TZ: ${TZ:-Asia/Kolkata}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3020}
  INGEST_INTERVAL_MINUTES: ${INGEST_INTERVAL_MINUTES:-30}
  INGEST_MAX_CONCURRENCY: ${INGEST_MAX_CONCURRENCY:-4}
  YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
  GEMINI_EMBED_MODEL: ${GEMINI_EMBED_MODEL:-text-embedding-004}
  GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-}
  GEMINI_RPM: ${GEMINI_RPM:-15}
  GEMINI_RPD: ${GEMINI_RPD:-1500}
  GEMINI_EMBED_RPM: ${GEMINI_EMBED_RPM:-100}
  CLUSTER_SIMILARITY: ${CLUSTER_SIMILARITY:-0.82}
  CURATE_BATCH_SIZE: ${CURATE_BATCH_SIZE:-25}
  RENDERER_URL: ${RENDERER_URL:-http://renderer:3100}
  RENDERER_TIMEOUT_SECONDS: ${RENDERER_TIMEOUT_SECONDS:-900}
  TTS_ENABLED: ${TTS_ENABLED:-true}
  TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-60}
  MUSIC_ENABLED: ${MUSIC_ENABLED:-true}
  MUSIC_GAIN_DB: ${MUSIC_GAIN_DB:--12}
  MUSIC_FADE_SECONDS: ${MUSIC_FADE_SECONDS:-1.5}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trendforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trendforge}
      POSTGRES_DB: ${POSTGRES_DB:-trendforge}
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "${POSTGRES_PORT:-5452}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trendforge} -d ${POSTGRES_DB:-trendforge}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6399}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # MinIO publish their images neither on Docker Hub nor anonymously on quay
  # any more, so local dev uses Bitnami's archived build. It is the same MinIO
  # server and speaks the same S3 API; prod is Cloudflare R2 regardless.
  # MINIO_DEFAULT_BUCKETS creates the assets bucket on first boot, which is why
  # there is no `mc` init container.
  minio:
    image: bitnamilegacy/minio:2025.4.22
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-trendforge}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-trendforge-secret}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-trendforge-assets}:download
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ports:
      - "${MINIO_PORT:-9020}:9000"
      - "${MINIO_CONSOLE_PORT:-9021}:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    # One image for api, worker and beat: they share a Dockerfile, and letting
    # compose build three meant `build api` left the worker on stale code.
    image: trendforge-api:latest
    restart: unless-stopped
    environment: *api-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${API_PORT:-8020}:8000"
    volumes:
      - ./apps/api:/srv/api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: trendforge-api:latest
    restart: unless-stopped
    environment: *api-env
    # solo pool keeps logs readable in dev; prefork in prod
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "worker", "--loglevel=info", "--pool=threads", "--concurrency=4"]
    volumes:
      - ./apps/api:/srv/api
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: trendforge-api:latest
    restart: unless-stopped
    environment: *api-env
    command: ["celery", "-A", "app.tasks.celery_app:celery_app", "beat", "--loglevel=info", "--schedule=/tmp/celerybeat-schedule"]
    volumes:
      - ./apps/api:/srv/api
    depends_on:
      redis:
        condition: service_healthy

  # Remotion, in its own image because it carries a Chromium. The Python
  # services reach it over the compose network; VideoProvider.is_configured()
  # is "does /health answer", so a renderer that is down means reels are
  # refused with a reason rather than failing mid-job.
  renderer:
    build:
      context: ./packages/remotion
      dockerfile: Dockerfile
    image: trendforge-renderer:latest
    restart: unless-stopped
    environment:
      RENDERER_PORT: "3100"
      # Two, not more. Measured on an 8-core/8GB host: four Chromium
      # instances at 1080x1920 ran a reel in 195s against 132s for two,
      # because they contend for memory rather than cores.
      REMOTION_CONCURRENCY: ${REMOTION_CONCURRENCY:-2}
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "${RENDERER_PORT:-3100}:3100"
    volumes:
      # One set of font files for both renderers. Read-only: the renderer has
      # no business writing to the API's assets.
      - ./apps/api/app/assets/fonts:/srv/renderer/public/fonts:ro
      # Compositions are bind-mounted so a design change does not need an
      # image rebuild; node_modules and the Chromium stay in the image.
      - ./packages/remotion/src:/srv/renderer/src:ro
      - ./packages/remotion/server:/srv/renderer/server:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Opt-in only: `docker compose --profile web up web`.
  # Default dev loop runs the web app on the Windows host via `pnpm dev`.
  web:
    profiles: ["web"]
    image: node:22-alpine
    working_dir: /srv/repo
    command: ["sh", "-c", "corepack enable pnpm && pnpm install --frozen-lockfile=false && pnpm --filter @trendforge/web dev --port 3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8020
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3020}:3000"
    volumes:
      - ./:/srv/repo
    depends_on:
      api:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  miniodata:
