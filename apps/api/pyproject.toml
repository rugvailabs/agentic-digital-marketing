[project]
name = "trendforge-api"
version = "0.1.0"
description = "TrendForge API + Celery worker (same package, two entrypoints)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.4",
  "pydantic-settings>=2.7.0",
  "celery[redis]>=5.4.0",
  "redis>=5.2.1",
  "httpx>=0.28.1",
  "feedparser>=6.0.11",
  "trendspy>=0.1.6",
  "structlog>=24.4.0",
  "python-dateutil>=2.9.0",
  # step 2
  "pgvector>=0.3.6",
  "pillow>=11.0.0",
  "boto3>=1.35.0",
  # step 3: Microsoft Neural voices for the reel voiceover. No key, and no
  # official API either — hence TTS_ENABLED.
  "edge-tts>=7.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "respx>=0.22.0",
  "ruff>=0.8.4",
  "mypy>=1.14.0",
  "types-python-dateutil>=2.9.0",
  # watchmedo restarts the celery worker when app/ changes. The api has
  # uvicorn --reload; celery has no equivalent and imports its task modules
  # once at startup, so an edited task kept running the old code from memory
  # until the container was recreated. Dev extra only: prod wants the restart
  # to be a deploy.
  "watchdog>=6.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One loop for the whole session. The api tests share a module-scoped engine,
# and a per-test loop leaves asyncpg connections bound to a dead loop
# ("another operation is in progress" on the second test).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
